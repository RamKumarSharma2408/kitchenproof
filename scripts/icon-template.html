<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0E1512;
    overflow: hidden;
  }
  .icon-box {
    width: 85%;
    height: 85%;
    border-radius: 22%;
    background: #151F1A;
    border: 1px solid rgba(122,180,140,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  svg {
    width: 70%;
    height: 70%;
  }
</style>
</head>
<body>
  <div class="icon-box">
    <svg viewBox="0 0 32 32" fill="none">
      <path d="M11 7.5L15 11.5L23 3" stroke="#7CC49A" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M5 21.5C5 13 10 9.5 16 9.5C22 9.5 27 13 27 21.5" stroke="#7CC49A" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M3.5 21.5H28.5" stroke="#7CC49A" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="16" cy="15.5" r="1.25" fill="#7CC49A"/>
    </svg>
  </div>
</body>
</html>
